services:
  api:
    build: ./backend
    container_name: azzurro-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  dashboard:
    image: node:22-alpine
    container_name: azzurro-dashboard
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
